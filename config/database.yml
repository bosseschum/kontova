default: &sqlite
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *sqlite
  database: storage/development.sqlite3
  schema_dump: schema.sqlite.rb

test:
  <<: *sqlite
  database: storage/test.sqlite3
  schema_dump: schema.sqlite.rb

default: &postgres
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

production:
  primary:
    <<: *postgres
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *postgres
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
  cable:
    <<: *postgres
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
  queue:
    <<: *postgres
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
